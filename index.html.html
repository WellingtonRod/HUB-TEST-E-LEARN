<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test &amp; Learn — Afya</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F5F7;color:#1A1A1A;min-height:100vh;}
.header{background:#CF085D;padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(207,8,93,.3);}
.header-logo{height:30px;}
.conn-lbl{font-size:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex-shrink:0;transition:background .3s;}
.conn-dot.ok{background:#4ADE80;}
.conn-dot.err{background:#FCA5A5;}
.topnav{background:#1C1C1E;display:flex;align-items:center;padding:0 24px;gap:2px;position:sticky;top:58px;z-index:95;}
.tnav-btn{background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;white-space:nowrap;}
.tnav-btn.on{color:#fff;border-bottom-color:#CF085D;}
.tnav-btn:hover:not(.on){color:rgba(255,255,255,.85);}
.bubar{background:#fff;border-bottom:1px solid #E5E5EA;padding:0 24px;display:flex;align-items:center;gap:2px;position:sticky;top:106px;z-index:90;overflow-x:auto;scrollbar-width:none;}
.bubar::-webkit-scrollbar{display:none;}
.bu-tab{display:flex;align-items:center;gap:5px;padding:0 12px;height:44px;border:none;background:none;cursor:pointer;font-size:14px;color:#6B6B6B;border-bottom:2px solid transparent;white-space:nowrap;}
.bu-tab.on{color:#CF085D;border-bottom-color:#CF085D;font-weight:600;}
.bu-tab:hover:not(.on){color:#1A1A1A;}
.bu-icon{background:none;border:none;cursor:pointer;color:#C0C0C0;font-size:11px;padding:2px 4px;border-radius:4px;display:none;line-height:1;}
.bu-tab.on .bu-icon{display:inline-flex;}
.bu-icon:hover{color:#CF085D;background:#FFF0F5;}
.bu-add{background:none;border:1px dashed #C8C8C8;color:#999;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer;margin-left:6px;}
.bu-add:hover{border-color:#CF085D;color:#CF085D;}
.main{max-width:1080px;margin:0 auto;padding:26px 22px;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid #E5E5EA;border-top-color:#CF085D;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:14px;color:#888;}
.viewbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.vtabs{display:flex;gap:2px;background:#E5E5EA;border-radius:8px;padding:3px;}
.vtab{padding:6px 15px;border:none;background:none;border-radius:6px;font-size:13px;color:#6B6B6B;cursor:pointer;}
.vtab.on{background:#fff;color:#CF085D;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.btn-new{background:#CF085D;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-new:hover{opacity:.87;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.mcard{background:#fff;border-radius:10px;padding:16px 18px;border:1px solid #E5E5EA;}
.mlbl{font-size:12px;color:#888;margin-bottom:5px;}
.mval{font-size:26px;font-weight:700;}
.mval.pink{color:#CF085D;}.mval.green{color:#1A8F4E;}
.ch{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;}
.ch-wa{background:#E8F9EE;color:#1A7340;}
.ch-em{background:#EAF0FF;color:#1B4FC1;}
.ch-sm{background:#FFF4E5;color:#A05C00;}
.ch-pu{background:#F3EEFF;color:#6B21C8;}
.ch-ig{background:#FFEEF6;color:#9B1063;}
.ch-xx{background:#F0F0F0;color:#666;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.b-todo{background:#F2F2F2;color:#666;}
.b-wip{background:#EBF3FF;color:#1B5FC1;}
.b-done{background:#EAFAF2;color:#1A8F4E;}
.uplift{font-size:13px;font-weight:700;color:#1A8F4E;}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#999;margin-bottom:10px;}
.rcard{background:#fff;border:1px solid #E5E5EA;border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.rcard:hover{border-color:#CF085D;}
.rcard-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.rcard-name{font-size:14px;font-weight:600;}
.rcard-hip{font-size:13px;color:#666;margin-top:5px;line-height:1.5;}
.rcard-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.col-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.col-badge{padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.tcard{background:#fff;border:1px solid #E5E5EA;border-radius:10px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.tcard:hover{border-color:#CF085D;box-shadow:0 2px 8px rgba(207,8,93,.1);}
.tcard-name{font-size:13px;font-weight:600;margin-bottom:6px;}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;flex-wrap:wrap;gap:4px;}
.tcard-date{font-size:11px;color:#C0C0C0;}
.col-new{width:100%;border:1px dashed #DDD;background:none;color:#AAA;border-radius:8px;padding:8px;font-size:13px;cursor:pointer;margin-top:6px;}
.col-new:hover{border-color:#CF085D;color:#CF085D;}
.wcard{background:#fff;border:1px solid #E5E5EA;border-radius:10px;padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
.wcard:hover{border-color:#CF085D;}
.w-rank{font-size:11px;color:#999;margin-bottom:3px;}
.w-name{font-size:15px;font-weight:700;margin-bottom:8px;}
.w-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.w-hip{font-size:13px;color:#666;line-height:1.5;margin-bottom:10px;}
.w-learn{background:#F8F8F8;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;}
.w-learn-lbl{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.w-uplift{font-size:28px;font-weight:800;color:#1A8F4E;}
.w-mlbl{font-size:11px;color:#999;text-align:right;}
.wtable{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px;border-top:1px solid #EEE;}
.wtable th{text-align:left;padding:4px 0;color:#999;font-weight:600;}
.wtable td{padding:3px 0;}
.wtable td:last-child{text-align:right;font-weight:600;}
.gl-banner{background:linear-gradient(135deg,#CF085D 0%,#8B0038 100%);border-radius:12px;padding:22px 24px;margin-bottom:20px;color:#fff;}
.gl-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.gl-sub{font-size:13px;opacity:.8;}
.gl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.gl-stat{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E5E5EA;text-align:center;}
.gl-stat-val{font-size:24px;font-weight:700;color:#CF085D;}
.gl-stat-lbl{font-size:12px;color:#888;margin-top:3px;}
.gl-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid #E5E5EA;border-radius:10px;padding:12px 14px;}
.gl-flbl{font-size:12px;font-weight:600;color:#888;margin-right:2px;}
.gl-fbtn{background:none;border:1px solid #DDD;border-radius:100px;padding:3px 11px;font-size:12px;cursor:pointer;color:#555;}
.gl-fbtn.on{background:#CF085D;border-color:#CF085D;color:#fff;font-weight:600;}
.gl-sep{width:1px;height:20px;background:#DDD;margin:0 4px;}
.lcard{background:#fff;border:1px solid #E5E5EA;border-radius:10px;padding:16px 18px;margin-bottom:10px;}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;}
.lcard-name{font-size:14px;font-weight:700;}
.lcard-bu{background:#F0F0F0;color:#555;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:600;}
.lcard-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.lcard-learn{background:#F8F8F8;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;}
.lcard-learn-lbl{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.lcard-uplift{font-size:22px;font-weight:800;color:#1A8F4E;text-align:right;flex-shrink:0;}
.empty{text-align:center;padding:60px 20px;}
.empty-ico{font-size:40px;margin-bottom:14px;}
.empty-ttl{font-size:15px;font-weight:600;color:#555;margin-bottom:6px;}
.empty-sub{font-size:13px;color:#AAA;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.ov.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:580px;padding:26px;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-ttl{font-size:16px;font-weight:700;}
.modal-x{background:none;border:none;font-size:20px;cursor:pointer;color:#999;line-height:1;}
.modal-x:hover{color:#1A1A1A;}
.field{margin-bottom:13px;}
.flbl{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.fhint{display:block;font-size:11px;color:#AAA;margin-bottom:4px;}
input.fi,select.fi,textarea.fi{width:100%;padding:8px 11px;border:1px solid #E0E0E0;border-radius:8px;font-size:14px;color:#1A1A1A;font-family:inherit;background:#fff;}
input.fi:focus,select.fi:focus,textarea.fi:focus{outline:none;border-color:#CF085D;box-shadow:0 0 0 3px rgba(207,8,93,.1);}
textarea.fi{min-height:70px;resize:vertical;line-height:1.5;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sdiv{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#CF085D;margin:18px 0 10px;padding-top:14px;border-top:1px solid #F0F0F0;}
.res-row{display:grid;grid-template-columns:2fr 1fr 1.5fr 1fr;gap:6px;margin-bottom:6px;}
.btn-addrow{background:none;border:1px dashed #CCC;color:#999;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;margin-bottom:12px;}
.btn-addrow:hover{border-color:#CF085D;color:#CF085D;}
.mfooter{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid #EEE;}
.btn-del-t{background:none;border:none;color:#C0392B;font-size:13px;cursor:pointer;}
.btn-del-t:hover{text-decoration:underline;}
.btn-cancel{background:none;border:1px solid #DDD;border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer;color:#555;}
.btn-cancel:hover{background:#F5F5F5;}
.btn-save{background:#CF085D;color:#fff;border:none;border-radius:8px;padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-save:hover{opacity:.87;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.btns-r{display:flex;gap:8px;}
.bumod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center;}
.bumod.open{display:flex;}
.bumod-box{background:#fff;border-radius:12px;padding:24px;width:340px;}
.bumod-ttl{font-size:15px;font-weight:700;margin-bottom:14px;}
.bumod-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.cfmod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center;}
.cfmod.open{display:flex;}
.cfmod-box{background:#fff;border-radius:12px;padding:24px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.cfmod-msg{font-size:14px;color:#333;line-height:1.5;margin-bottom:18px;}
.cfmod-btns{display:flex;justify-content:flex-end;gap:8px;}
.toast-el{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .4s;white-space:nowrap;}
@media(max-width:700px){.metrics,.gl-stats{grid-template-columns:1fr 1fr;}.kanban{grid-template-columns:1fr;}.g2,.res-row{grid-template-columns:1fr 1fr;}}
</style>
</head>

var BASE  = 'https://ecopyuobexkpbctrhftr.supabase.co/rest/v1';

var HDR   = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };

// ── REST API HELPERS (plain fetch, no SDK) ──────────────────
async function sbFetch(method, path, body) {
  // apikey in query string avoids CORS preflight on simple requests
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  var url = BASE + path + sep + 'apikey=' + KEY;

  var headers = {
    'Authorization': 'Bearer ' + KEY,
    'Accept': 'application/json'
  };
  if (body !== undefined) {
    headers['Content-Type'] = 'application/json';
    headers['Prefer'] = 'return=representation';
  }

  var opts = { method: method, headers: headers, mode: 'cors' };
  if (body !== undefined) opts.body = JSON.stringify(body);

  var res;
  try {
    res = await fetch(url, opts);
  } catch(netErr) {
    throw new Error('Sem conexão com o Supabase. Verifique se a tabela "testes" existe e se a RLS policy está configurada. Detalhe: ' + netErr.message);
  }

  var text = await res.text();

  if (!res.ok) {
    var msg = text;
    try {
      var j = JSON.parse(text);
      msg = j.message || j.hint || j.details || j.error || text;
      if (j.code === '42P01') msg = 'Tabela "testes" não encontrada. Execute o SQL de criação no Supabase SQL Editor.';
      if (res.status === 403)  msg = 'Acesso negado (403). Verifique se a RLS policy foi criada: CREATE POLICY "public_all" ON testes FOR ALL USING (true) WITH CHECK (true);';
    } catch(e){}
    throw new Error(msg);
  }

  if (!text || text === 'null') return null;
  return JSON.parse(text);
}

function sbSelect(table, params) {
  return sbFetch('GET', '/' + table + '?' + (params||'select=*&order=id'));
}
function sbInsert(table, row) {
  return sbFetch('POST', '/' + table, row);
}
function sbUpdate(table, filter, data) {
  return sbFetch('PATCH', '/' + table + '?' + filter, data);
}
function sbDelete(table, filter) {
  return sbFetch('DELETE', '/' + table + '?' + filter);
}

function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function mkEmpty(ico,t,s){ var d=document.createElement('div'); d.className='empty'; d.innerHTML='<div class="empty-ico">'+ico+'</div><div class="empty-ttl">'+t+'</div><div class="empty-sub">'+s+'</div>'; return d; }
function mkResTable(rs){
  if(!rs||!rs.length||!rs[0].modelo) return '';
  var t='<table class="wtable"><tr><th>Modelo</th><th>Data</th><th>Métrica</th><th style="text-align:right">Resultado</th></tr>';
  rs.forEach(function(r){ if(r.modelo) t+='<tr><td>'+h(r.modelo)+'</td><td>'+h(r.data)+'</td><td>'+h(r.metrica)+'</td><td>'+h(r.resultado)+'</td></tr>'; });

  var el=document.getElementById('__t'); if(el) el.remove();
  var t=document.createElement('div'); t.id='__t'; t.className='toast-el';
  t.style.background=err?'#C0392B':'#1A8F4E'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){t.remove();},400); },2800);
}
function getBUTests(){ return S.tests.filter(function(t){ return t.bu_name===S.activeBU; }); }

// ── DB MAPPING ───────────────────────────────────────────────
function fromDB(r){
  return {
    id:r.id, bu_name:r.bu_name||'BU 1',
    name:r.name||'', status:r.status||'a-fazer', canal:r.canal||'WhatsApp',
    hipotese:r.hipotese||'', metricaAlvo:r.metrica_alvo||'',
    metricaPivotar:r.metrica_pivotar||'', guardrail:r.guardrail||'',
    tamanho:r.tamanho||'', segmentacao:r.segmentacao||'', modelo:r.modelo||'',
    resultados:r.resultados||[], resultadoQualitativo:r.resultado_qualitativo||'',
    uplift:r.uplift||'',
    createdAt:r.created_at?new Date(r.created_at).toLocaleDateString('pt-BR'):''
  };
}
function toDB(t){
  return {
    bu_name:t.bu_name, name:t.name, status:t.status, canal:t.canal,
    hipotese:t.hipotese, metrica_alvo:t.metricaAlvo, metrica_pivotar:t.metricaPivotar,

  };
}

// ── DATA OPERATIONS ──────────────────────────────────────────
async function loadAll(){
  showLoading('Carregando dados…');
  try {
    var rows = await sbSelect('testes', 'select=*&order=id');
    S.tests = (rows||[]).map(fromDB);
    deriveBUs();
    setConn(true, 'Conectado');
    renderBUBar();
    renderMain();
  } catch(e) {
    setConn(false, 'Erro de conexão');
    var sql = 'CREATE TABLE IF NOT EXISTS testes (\n  id BIGSERIAL PRIMARY KEY,\n  bu_name TEXT NOT NULL DEFAULT \'BU 1\',\n  name TEXT, status TEXT DEFAULT \'a-fazer\',\n  canal TEXT DEFAULT \'WhatsApp\',\n  hipotese TEXT, metrica_alvo TEXT, metrica_pivotar TEXT,\n  guardrail TEXT, tamanho TEXT, segmentacao TEXT, modelo TEXT,\n  resultados JSONB DEFAULT \'[]\',\n  resultado_qualitativo TEXT, uplift TEXT,\n  created_at TIMESTAMPTZ DEFAULT NOW()\n);\nALTER TABLE testes ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "public_all" ON testes FOR ALL USING (true) WITH CHECK (true);';
    document.getElementById('main').innerHTML=
      '<div class="main"><div style="background:#FFF0F0;border:1px solid #FACCCC;border-radius:12px;padding:24px;margin-bottom:16px;">' +
      '<div style="font-size:18px;font-weight:700;color:#C0392B;margin-bottom:8px;">⚠️ Erro de conexão</div>' +
      '<div style="font-size:14px;color:#333;margin-bottom:16px;">'+h(e.message)+'</div>' +
      '<div style="font-size:13px;font-weight:600;color:#555;margin-bottom:8px;">Execute este SQL no Supabase SQL Editor (Database → SQL Editor):</div>' +
      '<pre style="background:#1C1C1E;color:#4ADE80;padding:16px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;line-height:1.6;">'+sql+'</pre>' +
      '<button onclick="loadAll()" style="margin-top:16px;background:#CF085D;color:white;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;">🔄 Tentar novamente</button>' +
      '</div></div>';
  }
}

async function dbInsert(t){
  var row = await sbInsert('testes', toDB(t));
  // PostgREST returns array on insert
  var r = Array.isArray(row) ? row[0] : row;
  return fromDB(r);
}
async function dbUpdate(t){
  await sbUpdate('testes', 'id=eq.'+t.id, toDB(t));
}
async function dbDelete(id){
  await sbDelete('testes', 'id=eq.'+id);
}
async function dbRenameBU(oldName, newName){
  await sbUpdate('testes', 'bu_name=eq.'+encodeURIComponent(oldName), {bu_name:newName});
}

// ── BU LOGIC ────────────────────────────────────────────────
function deriveBUs(){
  var seen={}, list=[];
  S.tests.forEach(function(t){ if(!seen[t.bu_name]){seen[t.bu_name]=true;list.push(t.bu_name);} });
  S.buNames.forEach(function(n){ if(!seen[n]) list.push(n); });
  if(!list.length) list=['BU 1'];
  S.buNames=list;
  if(!S.activeBU||S.buNames.indexOf(S.activeBU)<0) S.activeBU=S.buNames[0];
}

function openBUModal(n){ S.editBU=n; document.getElementById('buNameInput').value=n; document.getElementById('buMod').classList.add('open'); setTimeout(function(){ document.getElementById('buNameInput').focus(); },40); }
function closeBUModal(){ document.getElementById('buMod').classList.remove('open'); S.editBU=null; }
async function saveBUName(){
  var nv=document.getElementById('buNameInput').value.trim(), ov=S.editBU;
  closeBUModal();
  if(!nv||nv===ov) return;
  try {
    if(S.tests.some(function(t){ return t.bu_name===ov; })) await dbRenameBU(ov,nv);
    S.tests.forEach(function(t){ if(t.bu_name===ov) t.bu_name=nv; });
    var i=S.buNames.indexOf(ov); if(i>=0) S.buNames[i]=nv;
    if(S.activeBU===ov) S.activeBU=nv;
    renderBUBar(); renderMain(); toast('BU renomeada!');
  } catch(e){ toast('Erro: '+e.message,true); }
}

    else {

        var card=document.createElement('div'); card.className='rcard';
        var hip=t.hipotese?h(t.hipotese.slice(0,110))+(t.hipotese.length>110?'…':''):'';
        card.innerHTML='<div class="rcard-row"><div style="flex:1"><div class="rcard-name">'+h(t.name)+'</div>'+(hip?'<div class="rcard-hip">'+hip+'</div>':'')+'</div><div class="rcard-right">'+mkCh(t.canal)+(t.uplift?'<span class="uplift">'+h(t.uplift)+'</span>':'')+mkBadge(t.status)+'</div></div>';
        (function(id){ card.addEventListener('click',function(){ openEdit(id); }); })(t.id);

        var card=document.createElement('div'); card.className='tcard';
        card.innerHTML='<div class="tcard-name">'+h(t.name)+'</div>'+(t.metricaAlvo?'<div style="font-size:12px;color:#888;margin-bottom:4px;">📊 '+h(t.metricaAlvo)+'</div>':'')+'<div class="tcard-foot"><div style="display:flex;gap:4px;align-items:center;">'+mkCh(t.canal)+'<span class="tcard-date">'+h(t.createdAt||'')+'</span></div>'+(t.uplift?'<span class="uplift">'+h(t.uplift)+'</span>':'')+'</div>';

        col.appendChild(card);
      });
      var ab=document.createElement('button'); ab.className='col-new'; ab.textContent='+ Novo teste';

function openNew(status){
  S.curTest={id:null,isNew:true,bu_name:S.activeBU,name:'',status:status||'a-fazer',canal:'WhatsApp',hipotese:'',metricaAlvo:'',metricaPivotar:'',guardrail:'',tamanho:'',segmentacao:'',modelo:'',resultados:[{modelo:'',data:'',metrica:'',resultado:''}],resultadoQualitativo:'',uplift:'',createdAt:new Date().toLocaleDateString('pt-BR')};

function openEdit(id){
  var f=null; S.tests.forEach(function(t){ if(t.id===id) f=t; });

}

      customConfirm('Excluir este teste? Esta ação não pode ser desfeita.', async function(){
        try {
          await dbDelete(t.id);
          S.tests=S.tests.filter(function(x){ return x.id!==t.id; });
          closeModal(); renderMain(); toast('Teste excluído.');
        } catch(e){ toast('Erro: '+e.message,true); }
      });
    });
    left.appendChild(delBtn);
  }
  footer.appendChild(left);
  var right=document.createElement('div'); right.className='btns-r';
  var cb=document.createElement('button'); cb.className='btn-cancel'; cb.textContent='Cancelar'; cb.addEventListener('click',closeModal);
  var sb=document.createElement('button'); sb.className='btn-save'; sb.id='mSave'; sb.textContent='Salvar';
  sb.addEventListener('click', saveTest);
  right.appendChild(cb); right.appendChild(sb); footer.appendChild(right);
  body.appendChild(footer);
}

function closeModal(){ document.getElementById('testModal').classList.remove('open'); S.curTest=null; }
document.getElementById('modalX').addEventListener('click', closeModal);
document.getElementById('testModal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

async function saveTest(){
  var t=S.curTest;
  t.name=document.getElementById('f-name').value;
  t.status=document.getElementById('f-status').value;
  t.canal=document.getElementById('f-canal').value;
  t.hipotese=document.getElementById('f-hip').value;
  t.metricaAlvo=document.getElementById('f-ma').value;
  t.metricaPivotar=document.getElementById('f-mp').value;
  t.guardrail=document.getElementById('f-gr').value;
  t.tamanho=document.getElementById('f-tam').value;
  t.segmentacao=document.getElementById('f-seg').value;
  t.modelo=document.getElementById('f-mod').value;
  t.resultadoQualitativo=document.getElementById('f-rq').value;
  t.uplift=document.getElementById('f-upl').value;
  var sb=document.getElementById('mSave'); sb.disabled=true; sb.textContent='Salvando…';
  try {
    if(t.isNew){
      var saved=await dbInsert(t); S.tests.push(saved); deriveBUs();
    } else {
      await dbUpdate(t);
      for(var i=0;i<S.tests.length;i++){ if(S.tests[i].id===t.id){ S.tests[i]=t; break; } }
    }
    closeModal(); renderBUBar(); renderMain();
    toast(t.isNew?'Teste criado!':'Teste atualizado!');
  } catch(e){
    sb.disabled=false; sb.textContent='Salvar';
    toast('Erro ao salvar: '+e.message,true);
  }
}

// ── INIT ─────────────────────────────────────────────────────
loadAll();
</script>
